{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta | TDM Coach</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0" style="max-width: 480px; width: 100%;">
        <div class="card-body p-4">
            <h3 class="mb-1 text-center">Crear cuenta</h3>
            <p class="text-muted text-center mb-4">Registro de entrenador</p>

            <form method="post">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-dark w-100">
                    Crear cuenta
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}">Ya tengo cuenta</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
