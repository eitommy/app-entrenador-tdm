{% extends "asistencia/base.html" %}

{% block content %}

<div class="login-page d-flex justify-content-center align-items-center">
    <div class="login-card shadow-sm">
        <div class="text-center mb-4">
            <h1 class="login-title mb-1">
                🏓 TDM Coach
            </h1>

            <p class="text-muted mb-0">
                Acceso al sistema de entrenamiento
            </p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    autofocus
                    autocapitalize="none"
                    autocomplete="username"
                    maxlength="150"
                    required
                    id="id_username"
                    class="form-control"
                >
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                    id="id_password"
                    class="form-control"
                >
            </div>

            <button type="submit" class="btn btn-dark w-100">
                Ingresar al sistema
            </button>
        </form>

        <p class="text-muted small text-center mt-3 mb-0">
            El entrenador responsable se selecciona dentro de cada turno.
        </p>
    </div>
</div>

{% endblock %}
